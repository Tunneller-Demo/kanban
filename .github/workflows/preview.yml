name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  pruebas:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/pruebas.yml

  preview:
    needs: pruebas
    # `!cancelled()` deja borrar la preview al cerrar, cuando las pruebas se omiten.
    # La acción no admite PR desde forks: en ellos solo corren las pruebas.
    if: >-
      !cancelled()
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action == 'closed' || needs.pruebas.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: github.event.action != 'closed'
      - run: npm run build -- --base=/kanban/pr-preview/pr-${{ github.event.number }}/
        if: github.event.action != 'closed'
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: dist
          qr-code: 'false'
